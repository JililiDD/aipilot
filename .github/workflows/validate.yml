name: Validate plugin release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin layout
        run: node scripts/validate-plugin-layout.js

      - name: Run tests
        run: node --test

      - name: Run release preflight
        run: node scripts/release-check.js

      - name: Check whitespace errors
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Check every commit in the push or PR; fall back to the last commit when there is no usable base
          # (new branch, tag push).
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE=HEAD^; fi
          git diff --check "${BASE}" HEAD
